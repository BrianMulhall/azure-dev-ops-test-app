name: Continuous Integration

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: windows-latest
    environment: DEVELOPMENT
    steps:
      - name: Print out secrets and variables
        env:
          DATABASE_USER_NAME: ${{ secrets.DATABASE_USER_NAME }}
          TESTING: ${{ vars.TESTING }}
        run: |
          Write-Output "$env:DATABASE_USER_NAME"
          Write-Output "TESTING = $env:TESTING"
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/
      - uses: actions/upload-artifact@v4
        with:
          name: drop
          path: publish/
